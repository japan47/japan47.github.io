PF.forEach(([n,r0,c0,g0],i)=>{const [r,c]=POS[n]||[r0,c0];const g=GR[n]||g0;
  const b=document.createElement("button");
  b.className="tile"+(visits[n]?" on":"");

  b.innerHTML=svg(n)+n;
  b.onclick=()=>show(n,b);
  $("map").appendChild(b);tiles[n]=b;
});

function show(n,b){
  if(sel)sel.classList.remove("sel");
  sel=b;b.classList.add("sel");pop(b);
  const v=visits[n];
  $("cn").textContent=n;
  $("cardIcon").innerHTML=svg(n);
  $("ct").innerHTML=v?v.map(i=>fmt(TRIPS[i])+"<br>"+(TRIPS[i].n||"")).join("<br>"):"還沒來過，下次的目的地？";
  $("cardIcon").style.opacity=v?1:.35;
  $("card").classList.add("show");
}
$("x").onclick=()=>{$("card").classList.remove("show");if(sel)sel.classList.remove("sel")};

const done=Object.keys(visits).length;

["SPACIA X → 日光","九牛二虎之力才買到的第一車廂，月台難找，又碰上前一班誤點近 40 分鐘。日光走了好多路：神橋、東照宮，還爬了 200 多階去看睡貓。晚上 11 點還在研究行李要寄哪，最後決定直接拎去草津。",[IMG.y]],

days:[["熊本","傍晚降落熊本機場，晚上沒特別安排，就吃點好的，晚餐是熊本名店勝烈亭的豬排。這趟兩間在都市的飯店都選與車站共構的 JR 飯店，主打一個方便。",[]],
["熊本城 → 阿蘇","早上去地震後還在修復中的熊本城，只在城外的城彩苑逛逛，再到附近百貨走走。下午前往阿蘇，火車轉接駁車的時候行李箱把手竟然斷了。這晚住亀の井，特地選了熊本熊房型，晚餐升級螃蟹吃到飽，連第一盤都吃不完；自助餐剛整修過，連沙拉吧的橄欖油都有好多選擇。",[IMG.s]],
["鹿兒島","早上離開阿蘇前往鹿兒島，下午到仙巖園，可以遠眺櫻島火山，園內走起來很舒服，是推薦的散步景點。",[]],
["指宿","搭指宿之玉手箱列車前往指宿，先去風很大的龍宮神社，再到砂むし会館「砂楽」被埋起來。當天有點小雨，埋在沙裡還能聽著海浪聲；泡完溫泉出來喝牛奶，外面竟然出現彩虹，好幸運。回鹿兒島後去吃高級的黑豬肉料理壽庵。",[IMG.t]],
["櫻島","一早搭渡輪到櫻島，先去月讀神社走走，再到櫻島熔岩渚公園泡足湯，邊泡邊看火山；接著搭一段公車到湯之平展望所，看到火山正冒著一點煙。下午回鹿兒島最後採買，還去天文館無邪氣吃了可愛的白熊冰。",[IMG.u]],
["機場","早上沒行程，悠閒 check-out，吃個咖啡店早餐再去機場。等車時抽了亂馬 1/2 的一番賞，以為只會抽到手帕，結果抽到珊璞的拉麵碗。",[]]],

["美山町合掌村 → 天橋立 → 伊根舟屋","早上先到日本三大合掌村之一的美山町，我曾經和家人來住過，這次只是逛逛。接著到日本三景之一的天橋立，跟著旅行團行程，待不到半小時就要走了，還塞進伊根舟屋的行程；在船上餵海鷗，結果食物被老鷹搶走。",[IMG.h]],
["竹田城跡","今天是爬山的一天，傳說中的「日本馬丘比丘」，不過規模應該差很多。午餐體驗了手作蕎麥麵，也逛了出石城下町的老街。",[]],
["姬路城 → 大阪","早上到姬路城，去的城堡有點多了，已經沒什麼感覺。終於輪到自由行，總算有時間好好採買；我們被帶到心齋橋就自由活動，這晚和同事們聊到早上 4 點，快要死了…",[IMG.j]],

hotels:[["2/12–14","青森","ダイワロイネットホテル青森","ダイワロイネットホテル青森"],["2/14–15","青森","ホテル十和田荘","ホテル十和田荘"],["2/15–17","秋田","ホテルルートイン大曲駅前","ホテルルートイン大曲駅前"],["2/17–18","山形","仙峡の宿 銀山荘","仙峡の宿 銀山荘"],["2/18–19","山形","リッチモンドホテル山形駅前","リッチモンドホテル山形駅前"]],
days:[["帆立小屋","趕在台灣疫情封關前的最後一次日本旅，大家力除萬難出發了！晚上到達後，去車站附近的帆立小屋自己釣帆立貝，多到吃到怕。",[]],
["古川市場 → 弘前 → A-FACTORY","早餐在古川市場自己組海鮮丼，接著前往弘前，路上看到好多蘋果。先吃一碗熱熱的高砂蕎麥麵暖身，再到下雪的弘前城散步；回青森後逛我很愛的 A-FACTORY，有好多有趣的蘋果商品。",[IMG.v]],
["十和田湖冬物語","移動到十和田湖，參加第一個雪祭「十和田湖冬物語」。途中經過八戶快速吃午餐，吃了有趣的烏賊飯；check-in 後要等到晚上才有接駁車去會場，就先去踏雪，風景很美。晚上除了燈飾、雪屋裡可以喝酒，還有雪中屋台，重頭戲是煙火，還搭配冰雪奇緣的歌，這天剛好是情人節。",[IMG.A]],
["橫手雪祭","又是移動日，這天住在秋田的大曲，方便在秋田觀光。下午到第二個雪祭「橫手雪祭」，有很多雪屋可以進去體驗，還有人幫忙拍照；晚上走到另一個會場，學校裡佈滿了小雪屋，還在黑暗中爬山，有夠累。",[]],
["田澤湖 → 角館","來到有名的田澤湖，不知道是不是太冷，湖邊很荒涼。離開後到角館，路上也都沒什麼人，就看看房子、逛逛小店，還等了很久的車才回到大曲。",[]],
["銀山溫泉","到了最期待的銀山溫泉！因為同行有小孩，古民房很多都不收，所以選了偏離主要街區的大型旅館銀山莊，設施很不錯，但洗完澡後聊天聊到忘記出門拍照。",[IMG.B]],
["山形","起床後銀山溫泉下大雪，趕快跑去拍照。接著前往山形，本來要上藏王看樹冰，但我被冷到了，自己脫隊，中午吃了好吃的米澤牛，再去天童的 AEON 逛街；後來團員收到消息，強風無法上去看樹冰，就留在那邊玩雪，也有人跟著我來購物。推薦リッチモンドホテル山形駅前：房間很大、玄關和房間分開、房內有按摩椅，對面還有 24 小時超市，下次也想住。",[]],
["仙台機場","本來還要去 AEON，後來決定悠閒一點，到仙台機場參觀當年 311 大地震海嘯淹上來的標示線，真的很可怕。回程的飛機，是蛋黃哥陪我們回國。",[]]],

days:[["岡山","第一天沒什麼行程，晚餐吃了小豆島拉麵 HISHIO。",[]],
["鳥取","早上在東橫 INN 吃完免費早餐就出發去鳥取，到車站後在遊客服務中心訂了鳥取周遊計程車 3 小時。那天有點下雨，我們去了白兔神社、砂之美術館和鳥取砂丘，竟然有駱駝！砂丘比我想像中小，有趣的是還看得到海。從鳥取坐車到米子時，還遇到了柯南列車。",[IMG.D]],
["境港","說到境港就是鬼太郎～從米子站出發時，鬼太郎列車和月台就讓人拍個不停。到境港後先走水木茂之路，一路前往妖怪樂園、妖怪神社，整個很有氣氛；回程還坐到眼球大叔列車，好可愛。",[IMG.E]],
["出雲 → 松江","寄好行李後前往出雲，島根貓我來了！從車站前的表參道一路走到出雲大社，在前面的星巴克買了當地特有的咖啡杯，真的很好看。從出雲回松江站時，還有島根貓結緣電車，日本人真的很會！到松江後坐堀川めぐり遊覽船，印象最深的是經過橋下時，所有人都要趴低才過得去，要是聽不懂日文的人不就…XD 接著到松江城散步，最後加了島根縣立美術館，去拍十二隻兔兔，還要找第二隻的幸運兔；這天天氣不好，不然是看夕陽的好地點。",[IMG.F]],
["倉敷","時間過得飛快，這天是購物日，去了最愛的 LOFT，還在 MITSUI OUTLET PARK 倉敷買了鞋，逛街比觀光還累。",[]],
["岡山","很快到了最後一天，原本排的行程都沒去，因為前一天太累了。另外，這是第一次有家人來接機，而且竟然剛好遇到前同事，太巧了！",[]]],

 TRIPS.map((t,i)=>[t,i]).filter(([t])=>t.s.startsWith(yr)).sort((a,b)=>a[0].s.localeCompare(b[0].s)).forEach(([t,i])=>{

 });

function achData(){
 const tot={},got={};
 Object.entries(GR).forEach(([n,c])=>{tot[c]=(tot[c]||0)+1;if(visits[n])got[c]=(got[c]||0)+1});
 const cnt={};TRIPS.forEach(t=>t.p.forEach(p=>cnt[p]=(cnt[p]||0)+1));
 const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);
 const days=TRIPS.reduce((s,t)=>s+Math.round((new Date(t.e)-new Date(t.s))/864e5)+1,0);
 const ys=TRIPS.map(t=>+t.s.slice(0,4));
 return {tot,got,top,days,y0:Math.min(...ys),y1:Math.max(...ys)};
}
function renderAch(){
 const {tot,got,top,days,y0,y1}=achData();
 const full=REG.filter(([,c])=>(got[c]||0)===tot[c]).length;
 const rows=REG.map(([n,c])=>{const g=got[c]||0;return `<div class="rgrow" data-c="${c}"><span class="nm">${n}</span><span class="br"><i style="width:${g/tot[c]*100}%;background:var(${R[c]})"></i></span><span class="ct">${g}/${tot[c]}${g===tot[c]?" <b>✓</b>":""}</span></div>`}).join("");
 $("ach").innerHTML=`<div class="agrid"><button class="box ac done" data-k="san"><div class="k">日本三景</div><div class="v">3 / 3 ✓</div><div class="s">松島・天橋立・宮島</div></button><button class="box ac" data-k="trn"><div class="k">特色列車</div><div class="v">${TRN.length} 種</div><div class="s">SPACIA X・皮卡丘・玉手箱</div></button><button class="box ac" data-k="top"><div class="k">最常去</div><div class="v">${top[0][0]} ${top[0][1]} 趟</div><div class="s">${top[1][0]} ${top[1][1]}・${top[2][0]} ${top[2][1]}</div></button><button class="box ac" data-k="sta"><div class="k">旅行統計</div><div class="v">${TRIPS.length} 趟</div><div class="s">共 ${days} 天・${y0}–${y1}</div></button></div>`;
}
function openAch(k){
 const {top,days,y0,y1}=achData();
 let t,sub,rows;
 if(k==="san"){t="日本三景";sub="3 / 3　已集齊";rows=SAN.map(([n,d])=>[n,tl(tix(d)),tix(d)])}
 else if(k==="trn"){t="特色列車";sub="搭過的特別列車";rows=TRN.map(([n,d])=>[n,tl(tix(d)),tix(d)])}
 else if(k==="top"){t="最常去的縣市";sub="依出現在幾趟旅行計算";rows=top.slice(0,8).map(([n,c])=>[n,c+" 趟",-1])}
 else{t="旅行統計";sub="目前記錄的所有旅行";rows=[["旅行趟數",TRIPS.length+" 趟",-1],["總天數",days+" 天",-1],["時間跨度",y0+" – "+y1,-1],["已去過",Object.keys(visits).length+" / 47 個都道府縣",-1],["最北","北海道",-1],["最南","沖繩",-1]]}
 $("sc").innerHTML=`<button class="cl" aria-label="關閉">✕</button><div class="in"><h3 style="margin-right:44px">${t}</h3><p class="dt">${sub}</p>${rows.map(([a,b,i])=>`<div class="ar"${i>=0?` data-i="${i}"`:""}><b style="font-weight:normal">${a}</b><span>${b}</span></div>`).join("")}</div>`;
 $("sheet").classList.add("show");$("sc").scrollTop=0;
}
function hlRegion(c,name){
 const {tot,got}=achData();
 const names=Object.keys(GR).filter(n=>GR[n]===c),miss=names.filter(n=>!visits[n]);
 $("map").classList.add("hl");
 Object.entries(tiles).forEach(([n,b])=>b.classList.toggle("hit",GR[n]===c));
 $("hl").hidden=false;
 $("hl").innerHTML=`<div><b>${name}　${got[c]||0} / ${tot[c]}</b><br><span style="font-size:12px">${miss.length?"還沒去："+miss.join("・"):"已制霸！"}</span></div><button id="hx">看全部</button>`;
 $("hx").onclick=clearHl;
 $("hl").scrollIntoView({behavior:"smooth",block:"start"});
 names.forEach((n,k)=>setTimeout(()=>tiles[n]&&pop(tiles[n]),400+k*100));
}
renderAch();
$("ach").onclick=e=>{
 const r=e.target.closest(".rgrow");if(r){const c=r.dataset.c;return hlRegion(c,REG.find(x=>x[1]===c)[0])}
 const a=e.target.closest(".ac");if(a){pop(a);openAch(a.dataset.k)}
};
const body=d=>`<div class="sec"><span class="lb">航班</span>${d.fl.map(x=>`<p>${x}</p>`).join("")}</div><div class="sec"><span class="lb">住宿</span>${d.hotels.map(x=>`<p>${x[0]}　${x[1]}・<a class="lk" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x[3])}" target="_blank" rel="noopener">${x[2]}</a></p>`).join("")}</div>${d.days.map((x,k)=>`<div class="day"><span class="dn">Day ${k+1}</span><b>${x[0]}</b><p>${x[1]}</p>${x[2].map(s=>`<img src="${s}" alt="" loading="lazy" decoding="async">`).join("")}</div>`).join("")}${d.spots?spotsHtml(d):""}`;
function spotsHtml(d){return `<div class="sec"><span class="lb">重要景點</span><p class="rt">${d.route}</p>${d.spots.map(g=>`<div class="sg"><span class="chip" style="background:var(${R[GR[g[0]]]})">${g[0]}</span>${g[1].map(s=>`<a class="spot" href="${s[3]||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s[2])}`}" target="_blank" rel="noopener"><i>${s[1]}</i>${s[0]}</a>`).join("")}</div>`).join("")}</div>`}
function openTrip(i){
 cur=i;const t=TRIPS[i],d=DIARY[t.s];
 $("sc").innerHTML=`<button class="cl" aria-label="關閉">✕</button>${d&&d.cover?`<img class="cv" src="${d.cover}" alt="" decoding="async">`:`<div class="cv" style="background:var(${R[GR[t.p[0]]]})">${svg(t.p[0])}</div>`}<div class="in"><h3>${t.s.slice(0,4)}・${d?d.t:(t.n||t.p.join("、"))}</h3><p class="dt">${fmt(t)}</p><div>${t.p.map(p=>`<span class="chip go" data-p="${p}">${p}</span>`).join("")}</div>${d?body(d):'<p class="soon">遊記整理中，之後會補上照片和故事。</p>'}<button class="mb">在地圖上看這趟</button></div>`;
 $("sheet").classList.add("show");$("sc").scrollTop=0;
}
function hlTrip(i){const t=TRIPS[i],d=DIARY[t.s];
 $("map").classList.add("hl");
 Object.entries(tiles).forEach(([n,b])=>b.classList.toggle("hit",t.p.includes(n)));
 $("hl").hidden=false;
 $("hl").innerHTML=`<div><b>${t.s.slice(0,4)}・${d?d.t:(t.n||t.p.join("、"))}</b><br><span style="font-size:12px">${fmt(t)}｜${d&&d.route?d.route:t.p.join("、")}</span></div><button id="hx">看全部</button>`;
 $("hx").onclick=clearHl;
 t.p.forEach((p,k)=>setTimeout(()=>tiles[p]&&pop(tiles[p]),400+k*120));}
function clearHl(){$("map").classList.remove("hl");$("hl").hidden=true;Object.values(tiles).forEach(b=>b.classList.remove("hit"))}
const closeS=()=>$("sheet").classList.remove("show");
$("sheet").onclick=e=>{
 if(e.target.id==="sheet"||e.target.closest(".cl"))return closeS();
 const r=e.target.closest(".ar[data-i]");if(r){openTrip(+r.dataset.i);return}
 const g=e.target.closest(".go");
 if(g){closeS();window.scrollTo({top:0,behavior:"smooth"});setTimeout(()=>show(g.dataset.p,tiles[g.dataset.p]),350);return}
 if(e.target.closest(".mb")){closeS();window.scrollTo({top:0,behavior:"smooth"});hlTrip(cur)}
};
</script>
</body>
</html>

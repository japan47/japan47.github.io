<style>

*{box-sizing:border-box}
html{height:100%}

main{max-width:480px;margin:0 auto;padding:18px 14px 120px}
h1{font-size:24px;margin:4px 0 2px;text-align:center}
.sub{text-align:center;font-size:13px;margin:0 0 14px;opacity:.75}
.box{border:3px solid var(--ink);border-radius:26px;background:var(--paper);padding:14px}
.count{display:flex;align-items:baseline;justify-content:center;gap:6px;font-size:15px}
.count b{font-size:34px}
.bar{height:16px;border:3px solid var(--ink);border-radius:99px;margin-top:8px;overflow:hidden;background:var(--paper)}
.bar i{display:block;height:100%;background:var(--pink);border-right:3px solid var(--ink);transition:width .6s}

.tile{aspect-ratio:1;border:2.5px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);font:inherit;font-size:9px;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;opacity:.55}
.tile.on{opacity:1}
.tile svg{width:19px;height:19px;display:none}
.tile.on svg{display:block;animation:float 3s ease-in-out infinite;animation-delay:var(--d)}
.tile.sel{outline:3px solid var(--ink);outline-offset:2px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3px) rotate(3deg)}}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(.78)}60%{transform:scale(1.22)}80%{transform:scale(.96)}100%{transform:scale(1)}}
.pop{animation:pop .5s cubic-bezier(.3,1.4,.5,1)}
h2{font-size:18px;margin:22px 0 10px}
.trip{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);margin-bottom:10px;cursor:pointer}

.trip .d{font-size:15px;margin:6px 0 2px}
.trip .n{font-size:13px;opacity:.75;margin:0 0 6px}
.chip{display:inline-block;border:2.5px solid var(--ink);border-radius:99px;padding:0 9px;font-size:13px;margin:2px 4px 2px 0;background:var(--blue)}

#card.show{transform:none}
#card .box{display:flex;gap:12px;align-items:center;background:var(--yellow)}
#card svg{width:84px;height:84px;flex:none;animation:float 3s ease-in-out infinite}
#card h3{margin:0 0 2px;font-size:20px}
#card p{margin:0;font-size:13px;line-height:1.5}
#x{position:absolute;right:22px;top:8px;border:0;background:none;font:inherit;font-size:18px;color:var(--ink);cursor:pointer}
.hint{font-size:12px;opacity:.7;text-align:center;margin-top:18px;line-height:1.6}

.tab{flex:none;font:inherit;font-size:14px;color:var(--ink);border:2.5px solid var(--ink);border-radius:99px;background:var(--paper);padding:1px 11px;cursor:pointer}

.tc{position:relative;border:3px solid var(--ink);border-radius:22px;background:var(--paper);color:var(--ink);font:inherit;text-align:left;padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}

#sheet.show .sc{transform:none}

.cv{width:100%;height:190px;object-fit:cover;display:flex;align-items:center;justify-content:center;border-bottom:3px solid var(--ink);margin-top:-46px}
.cv svg{width:80px;height:80px}
.in{padding:14px 16px 28px}
.in h3{font-size:21px;margin:0}
.dt{font-size:13px;opacity:.75;margin:2px 0 8px}
.go{cursor:pointer}
.sec{margin-top:14px}.sec p{margin:5px 0 0;font-size:13px}
.lb{display:inline-block;background:var(--yellow);border:2.5px solid var(--ink);border-radius:99px;padding:0 10px;font-size:12px}
.day{margin-top:16px;padding-top:12px;border-top:3px dashed var(--ink)}
.dn{display:inline-block;background:var(--blue);border:2.5px solid var(--ink);border-radius:99px;padding:0 9px;font-size:12px;margin-right:4px}

.soon{font-size:13px;opacity:.7;margin:16px 0}

const M={東京:"tower",京都:"torii",大阪:"castle",熊本:"castle",愛知:"castle",滋賀:"lake",福井:"dino",靜岡:"fuji",山梨:"fuji",奈良:"deer",青森:"apple",福岡:"ramen",北海道:"snow",沖繩:"flower",佐賀:"balloon",長崎:"lantern",大分:"onsen",千葉:"light",長野:"monkey",神奈川:"buddha",兵庫:"ship",新潟:"rice",岐阜:"house",富山:"tulip",石川:"koto",香川:"udon",德島:"swirl",高知:"fish",愛媛:"orange",鹿兒島:"volcano",岡山:"peach",鳥取:"dune",島根:"rope",山口:"fugu",廣島:"float",秋田:"dog",山形:"cherry",宮城:"tanabata",岩手:"bowls",福島:"cow",栃木:"berry",群馬:"daruma"};
const svg=n=>`<svg viewBox="0 0 64 64" fill="none" stroke="#3E3A39" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${I[M[n]||"pin"]}</svg>`;

const $=id=>document.getElementById(id);
const visits={};
TRIPS.forEach((t,i)=>t.p.forEach(p=>(visits[p]=visits[p]||[]).push(i)));
const fmt=t=>{const a=t.s.replace(/-/g,"/"),b=t.e.replace(/-/g,"/");return a+" – "+(a.slice(0,4)===b.slice(0,4)?b.slice(5):b)};
const pop=el=>{el.classList.remove("pop");void el.offsetWidth;el.classList.add("pop")};
const tiles={};
let sel=null;

const POS={北海道:[0,9],青森:[1,9],秋田:[2,8],岩手:[2,9],山形:[3,8],宮城:[3,9],新潟:[4,8],福島:[4,9],長野:[5,7],群馬:[5,8],栃木:[5,9],石川:[5,5],富山:[5,6],福井:[6,5],岐阜:[6,6],山梨:[6,7],埼玉:[6,8],茨城:[6,9],島根:[6,1],鳥取:[6,2],兵庫:[6,3],京都:[6,4],山口:[7,0],廣島:[7,1],岡山:[7,2],大阪:[7,3],滋賀:[7,4],愛知:[7,5],靜岡:[7,6],神奈川:[7,7],東京:[7,8],千葉:[7,9],福岡:[8,0],大分:[8,1],愛媛:[8,2],香川:[8,3],奈良:[8,4],三重:[8,5],佐賀:[9,0],熊本:[9,1],高知:[9,2],德島:[9,3],和歌山:[9,4],長崎:[10,0],宮崎:[10,1],鹿兒島:[11,1],沖繩:[12,0]};
PF.forEach(([n,r0,c0,g0],i)=>{const [r,c]=POS[n]||[r0,c0];const g=GR[n]||g0;
  const b=document.createElement("button");
  b.className="tile"+(visits[n]?" on":"");
  b.style.gridRow=r+1;b.style.gridColumn=c+1;b.style.setProperty("--d",(i%7)*.3+"s");
  if(visits[n])b.style.background=`var(${R[g]})`;
  b.innerHTML=svg(n)+n;
  b.onclick=()=>show(n,b);
  $("map").appendChild(b);tiles[n]=b;
});

function show(n,b){
  if(sel)sel.classList.remove("sel");
  sel=b;b.classList.add("sel");pop(b);
  const v=visits[n];
  $("cn").textContent=n;
  $("cardIcon").innerHTML=svg(n);
  $("ct").innerHTML=v?v.map(i=>fmt(TRIPS[i])+"<br>"+(TRIPS[i].n||"")).join("<br>"):"還沒來過，下次的目的地？";
  $("cardIcon").style.opacity=v?1:.35;
  $("card").classList.add("show");
}
$("x").onclick=()=>{$("card").classList.remove("show");if(sel)sel.classList.remove("sel")};

const done=Object.keys(visits).length;
$("n").textContent=done;$("bar").style.width=done/47*100+"%";

const years=[...new Set(TRIPS.map(t=>t.s.slice(0,4)))].sort();
let yr=years[years.length-1],cur=0;
const tabs=$("tabs");
tabs.innerHTML=years.map(y=>`<button class="tab" data-y="${y}">${y}</button>`).join("");
function draw(){
 [...tabs.children].forEach(b=>b.classList.toggle("on",b.dataset.y===yr));
 $("trips").innerHTML="";
 TRIPS.map((t,i)=>[t,i]).filter(([t])=>t.s.startsWith(yr)).sort((a,b)=>a[0].s.localeCompare(b[0].s)).forEach(([t,i])=>{
  const d=DIARY[t.s],e=document.createElement("button");
  e.className="tc";
  const cv=d&&d.cover,bg=cv?`background-image:url(${d.cover})`:`background-color:var(${R[GR[t.p[0]]]})`;
  e.innerHTML=`<div class="ph" style="${bg}">${cv?"":svg(t.p[0])}</div>${d?'<span class="tag">遊記</span>':""}<div class="b"><p class="d">${fmt(t)}</p><p class="n">${t.n||""}</p>${t.p.map(p=>`<span class="chip">${p}</span>`).join("")}</div>`;
  e.onclick=()=>{pop(e);openTrip(i)};
  $("trips").appendChild(e);
 });
}
tabs.onclick=e=>{const b=e.target.closest(".tab");if(b){yr=b.dataset.y;draw();pop(b)}};
draw();tabs.scrollLeft=tabs.scrollWidth;
const body=d=>`<div class="sec"><span class="lb">航班</span>${d.fl.map(x=>`<p>${x}</p>`).join("")}</div><div class="sec"><span class="lb">住宿</span>${d.hotels.map(x=>`<p>${x[0]}　${x[1]}・<a class="lk" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(x[3])}" target="_blank" rel="noopener">${x[2]}</a></p>`).join("")}</div>${d.days.map((x,k)=>`<div class="day"><span class="dn">Day ${k+1}</span><b>${x[0]}</b><p>${x[1]}</p>${x[2].map(s=>`<img src="${s}" alt="">`).join("")}</div>`).join("")}${d.spots?spotsHtml(d):""}`;
function spotsHtml(d){return `<div class="sec"><span class="lb">重要景點</span><p class="rt">${d.route}</p>${d.spots.map(g=>`<div class="sg"><span class="chip" style="background:var(${R[GR[g[0]]]})">${g[0]}</span>${g[1].map(s=>`<a class="spot" href="${s[3]||`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s[2])}`}" target="_blank" rel="noopener"><i>${s[1]}</i>${s[0]}</a>`).join("")}</div>`).join("")}</div>`}
function openTrip(i){
 cur=i;const t=TRIPS[i],d=DIARY[t.s];
 $("sc").innerHTML=`<button class="cl" aria-label="關閉">✕</button>${d&&d.cover?`<img class="cv" src="${d.cover}" alt="">`:`<div class="cv" style="background:var(${R[GR[t.p[0]]]})">${svg(t.p[0])}</div>`}<div class="in"><h3>${t.s.slice(0,4)}・${d?d.t:(t.n||t.p.join("、"))}</h3><p class="dt">${fmt(t)}</p><div>${t.p.map(p=>`<span class="chip go" data-p="${p}">${p}</span>`).join("")}</div>${d?body(d):'<p class="soon">遊記整理中，之後會補上照片和故事。</p>'}<button class="mb">在地圖上看這趟</button></div>`;
 $("sheet").classList.add("show");$("sc").scrollTop=0;
}
function hlTrip(i){const t=TRIPS[i],d=DIARY[t.s];
 $("map").classList.add("hl");
 Object.entries(tiles).forEach(([n,b])=>b.classList.toggle("hit",t.p.includes(n)));
 $("hl").hidden=false;
 $("hl").innerHTML=`<div><b>${t.s.slice(0,4)}・${d?d.t:(t.n||t.p.join("、"))}</b><br><span style="font-size:12px">${fmt(t)}｜${d&&d.route?d.route:t.p.join("、")}</span></div><button id="hx">看全部</button>`;
 $("hx").onclick=clearHl;
 t.p.forEach((p,k)=>setTimeout(()=>tiles[p]&&pop(tiles[p]),400+k*120));}
function clearHl(){$("map").classList.remove("hl");$("hl").hidden=true;Object.values(tiles).forEach(b=>b.classList.remove("hit"))}
const closeS=()=>$("sheet").classList.remove("show");
$("sheet").onclick=e=>{
 if(e.target.id==="sheet"||e.target.closest(".cl"))return closeS();
 const g=e.target.closest(".go");
 if(g){closeS();window.scrollTo({top:0,behavior:"smooth"});setTimeout(()=>show(g.dataset.p,tiles[g.dataset.p]),350);return}
 if(e.target.closest(".mb")){closeS();window.scrollTo({top:0,behavior:"smooth"});hlTrip(cur)}
};
</script>

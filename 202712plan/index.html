else if(a=="cd"){S.costs=S.costs.filter(x=>x.id!=id);save()}

else if(a=="fdel"){if(confirm("確定刪除這間餐廳？")){S.food=S.food.filter(x=>x.id!=id);save()}}};
$("#ted").onchange=e=>{var k=e.target.dataset.k;if(k){S.trip[k]=e.target.value;save()}};
$("#ta").onclick=()=>{var x=$("#tx").value.trim();if(!x)return;S.todos.push({id:S.nid++,cat:$("#tc").value.trim(),text:x,done:false});$("#tx").value="";save()};
$("#ex").onclick=()=>{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));a.download="trip-backup-"+new Date().toISOString().slice(0,10)+".json";a.click()};
$("#im").onchange=e=>{var f=e.target.files[0];if(!f)return;f.text().then(t=>{var o=JSON.parse(t);if(!o.items||!o.trip)throw 0;S=o;save();alert("匯入完成")}).catch(()=>alert("檔案格式不正確"))};
$("#rs").onclick=()=>{if(confirm("要清除目前所有資料，還原成預設行程嗎？")){S=mk();save()}};
render();
</script></body></html>

    :root {
      --morandi-cream: #efece6;
      --card-surface: #fdfbf7;
      --walnut-deep: #3b2d25;
      --walnut-mid: #5a4437;
      --matte-black: #1e1c1a;
      --sand-border: #dcd4c8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background-color: var(--morandi-cream);
      color: var(--matte-black);
    }
    .walnut-header {

      border-bottom: 1px solid #231a15;
    }
    .glass-walnut {
      background: rgba(253, 251, 247, 0.12);
      border: 1px solid rgba(253, 251, 247, 0.22);
    }
    .tab-active {
      background-color: var(--walnut-deep);
      color: #fdfbf7;
      box-shadow: 0 4px 12px rgba(43, 33, 27, 0.18);
    }
    .tab-inactive {
      background-color: var(--card-surface);
      color: var(--walnut-deep);
      border: 1px solid var(--sand-border);
    }
    .warm-card {
      background-color: var(--card-surface);
      border: 1px solid var(--sand-border);
      box-shadow: 0 6px 18px rgba(43, 33, 27, 0.04);
    }
    .btn-walnut { background-color: var(--walnut-deep); color: #fdfbf7; }
    .btn-walnut:hover { background-color: var(--walnut-mid); }
    .btn-matte { background-color: var(--matte-black); color: #fdfbf7; }
    #map { height: 420px; border-radius: 16px; z-index: 1; border: 1px solid var(--sand-border); }
  </style>
</head>

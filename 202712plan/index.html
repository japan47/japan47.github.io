<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>❄️ 2027 冬季日本行程｜滋賀・福井・名古屋（12/19–12/24）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    :root {
      --snow-bg: #f3f7fb;
      --ice-card: #ffffff;
      --nordic-navy: #0f294a;
      --nordic-blue: #1d4ed8;
      --frost-border: #dce7f3;
      --accent-ice: #38bdf8;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
      background: linear-gradient(180deg, #e8f1fa 0%, var(--snow-bg) 280px, #f8fafc 100%);
      color: #0f172a;
    }
    .hero-nordic {
      background: linear-gradient(135deg, #0b1f3a 0%, #133b6b 55%, #1e5aa8 100%);
    }
    .glass-pill {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.22);
    }
    .tab-active {
      background: linear-gradient(135deg, #0f294a, #1d4ed8);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(29, 78, 216, 0.22);
    }
    .tab-inactive {
      background: rgba(255, 255, 255, 0.9);
      color: #1e3a5f;
      border: 1px solid var(--frost-border);
    }
    .frost-card {
      background: var(--ice-card);
      border: 1px solid var(--frost-border);
      box-shadow: 0 6px 20px rgba(15, 41, 74, 0.05);
    }
    #map {
      height: 430px;
      border-radius: 16px;
      z-index: 1;
    }
  </style>
</head>
<body class="min-h-screen pb-12">
  <!-- 冬季北陸風格頁首與 Google 登入列 -->
  <header class="hero-nordic text-white sticky top-0 z-30 shadow-lg">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-2xl glass-pill flex items-center justify-center text-xl">❄️</div>
        <div>
          <h1 class="text-base sm:text-xl font-bold tracking-wide">2027 冬季北陸＆名古屋行程手冊</h1>
          <p class="text-xs text-sky-100/90">2027/12/19 – 2027/12/24（6 天 5 夜）· 滋賀・福井・名古屋</p>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <span id="syncStatus" class="text-xs px-3 py-1 rounded-full glass-pill text-sky-100">
          尚未登入（本機暫存）
        </span>

        <div id="userBadge" class="hidden items-center gap-2 glass-pill px-3 py-1 rounded-full text-xs">
          <span id="userEmail" class="text-sky-200 font-semibold"></span>
          <button onclick="logoutGoogle()" class="text-rose-200 hover:text-white underline">登出</button>
        </div>

        <button id="loginBtn" onclick="loginGoogle()" class="bg-sky-400 hover:bg-sky-300 text-slate-950 font-bold text-xs sm:text-sm px-4 py-1.5 rounded-xl shadow transition cursor-pointer">
          使用 Google 帳戶登入
        </button>
      </div>
    </div>
  </header>
